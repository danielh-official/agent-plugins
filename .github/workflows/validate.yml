name: Validate marketplace

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx run ruff==0.16.10 check .
      - run: pipx run ruff==0.16.10 format --check .
      - run: npx --yes @biomejs/biome@2.5.14 check .
      - run: python3 scripts/validate.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m unittest discover -s plugins/calslashd/scripts -p 'test_*.py' -v
      - run: python3 plugins/calslashd/skills/calslashd/scripts/selfcheck.py
      - run: python3 plugins/calslashd/skills/calorie-streak-calendars/scripts/selfcheck.py
